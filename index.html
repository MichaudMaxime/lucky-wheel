<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#030712">
  <title>Roulette Tirage au Sort</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #030712;
      color: #f3f4f6;
      height: 100dvh;
      overflow: hidden;
      touch-action: pan-y;
      padding-top: var(--sat);
      padding-bottom: var(--sab);
      padding-left: var(--sal);
      padding-right: var(--sar);
    }

    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.4);
      border-radius: 9999px;
    }

    .pointer-shadow {
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.6));
    }
  </style>
</head>
<body class="flex flex-col relative w-full h-[100dvh]">

  <!-- Top bar -->
  <header class="w-full h-14 border-b border-gray-800/80 bg-gray-950/70 backdrop-blur-md px-4 flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-md shadow-indigo-500/20">
        <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" />
        </svg>
      </div>
      <div class="flex items-center gap-1.5">
        <h1 class="text-sm font-bold text-white tracking-tight flex items-center gap-1.5">
          Tirage au Sort
          <span id="stealth-indicator" class="w-1.5 h-1.5 rounded-full bg-transparent inline-block"></span>
        </h1>
      </div>
    </div>

    <div class="flex items-center gap-1.5">
      <button id="sound-btn" class="w-9 h-9 rounded-xl border border-gray-800 bg-gray-900/80 active:bg-gray-800 flex items-center justify-center text-gray-300 transition-colors" aria-label="Son">
        <svg id="icon-sound-on" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        </svg>
        <svg id="icon-sound-off" class="w-4 h-4 hidden text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
        </svg>
      </button>

      <button id="haptic-btn" class="w-9 h-9 rounded-xl border border-gray-800 bg-gray-900/80 active:bg-gray-800 flex items-center justify-center text-gray-300 transition-colors" aria-label="Vibration">
        <svg id="icon-vibrate-on" class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
        </svg>
      </button>
    </div>
  </header>

  <main class="flex-1 relative w-full overflow-hidden">
    
    <!-- VIEW 1: WHEEL -->
    <section id="view-wheel" class="absolute inset-0 flex flex-col items-center justify-between px-4 py-3 z-10">
      
      <!-- Quick status pill -->
      <div class="w-full flex items-center justify-between max-w-sm px-1 text-xs">
        <div class="flex items-center gap-1.5 bg-gray-900/80 px-2.5 py-1 rounded-full border border-gray-800 text-gray-400 font-medium">
          <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span id="quick-count">0</span> participant(s)
        </div>
        <button id="quick-shuffle-btn" class="flex items-center gap-1 text-gray-400 active:text-indigo-400 py-1 px-2">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>Mélanger</span>
        </button>
      </div>

      <!-- Wheel Container -->
      <div class="relative w-full max-w-[340px] sm:max-w-[400px] aspect-square my-auto flex items-center justify-center">
        <!-- Glow -->
        <div class="absolute inset-4 rounded-full bg-gradient-to-tr from-indigo-600/20 to-violet-600/20 blur-xl pointer-events-none"></div>

        <!-- Needle -->
        <div class="absolute -top-1 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center pointer-shadow">
          <svg class="w-8 h-8 text-amber-400 filter drop-shadow-md" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 21.5L3.5 6.5h17L12 21.5z" />
          </svg>
          <div class="w-2.5 h-2.5 bg-amber-100 rounded-full -mt-6 ring-2 ring-amber-500"></div>
        </div>

        <!-- High-DPI Canvas -->
        <canvas id="roulette-canvas" class="relative z-10 w-full h-full rounded-full shadow-2xl border-4 border-gray-800 bg-gray-950"></canvas>

        <!-- Center Hub Button -->
        <button id="spin-hub-btn" class="absolute z-20 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-600 border-4 border-gray-900 shadow-xl shadow-indigo-950/80 active:scale-95 transition-transform flex flex-col items-center justify-center cursor-pointer">
          <span class="text-white font-black text-xs tracking-wider uppercase drop-shadow">SPIN</span>
        </button>
      </div>

      <!-- Action Button -->
      <div class="w-full max-w-sm flex flex-col items-center gap-2 pb-2">
        <button id="main-spin-btn" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 active:from-indigo-700 active:to-violet-700 text-white font-bold text-base shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 transition-all">
          <svg id="spin-loader" class="w-5 h-5 animate-spin hidden" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span id="spin-btn-text">Lancer le tirage</span>
        </button>
      </div>
    </section>

    <!-- VIEW 2: PARTICIPANTS -->
    <section id="view-participants" class="absolute inset-0 flex flex-col bg-gray-950 px-4 py-3 z-10 hidden overflow-hidden">
      
      <!-- Input -->
      <div class="flex gap-2 mb-3 shrink-0">
        <input type="text" id="input-name" placeholder="Ajouter un prénom..." class="flex-1 bg-gray-900 border border-gray-800 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-gray-500 outline-none transition-colors">
        <button id="btn-add-single" class="px-4 py-2.5 bg-indigo-600 active:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition-all flex items-center gap-1.5 shrink-0">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
          </svg>
          <span>Ajouter</span>
        </button>
      </div>

      <!-- Bulk paste toggle -->
      <details class="mb-3 bg-gray-900/60 rounded-xl border border-gray-800/80 shrink-0">
        <summary class="px-3 py-2 text-xs font-medium text-indigo-400 cursor-pointer flex items-center justify-between">
          <span class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            Coller une liste (un par ligne)
          </span>
          <svg class="w-3 h-3 transition-transform text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </summary>
        <div class="p-3 pt-0 flex flex-col gap-2">
          <textarea id="bulk-names-area" rows="3" placeholder="Copiez/collez les prénoms ici..." class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-xs text-white placeholder-gray-600 outline-none focus:border-indigo-500"></textarea>
          <div class="flex justify-end gap-2">
            <button id="btn-import-bulk" class="px-3 py-1.5 bg-indigo-600 active:bg-indigo-700 text-white rounded-lg text-xs font-semibold">
              Importer la liste
            </button>
          </div>
        </div>
      </details>

      <!-- Header actions -->
      <div class="flex items-center justify-between pb-2 border-b border-gray-800/80 shrink-0">
        <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">Participants (<span id="list-count-badge">0</span>)</span>
        <button id="btn-clear-all" class="text-xs text-rose-400 active:text-rose-300 flex items-center gap-1 py-1">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          Tout effacer
        </button>
      </div>

      <!-- List -->
      <div id="participants-container" class="flex-1 overflow-y-auto custom-scroll py-2 space-y-1.5">
        <!-- Populated via JS -->
      </div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="w-full h-16 border-t border-gray-800/80 bg-gray-950/80 backdrop-blur-lg grid grid-cols-2 z-20 shrink-0">
    <button id="nav-btn-wheel" class="flex flex-col items-center justify-center gap-1 text-indigo-400 transition-colors">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" />
      </svg>
      <span class="text-[11px] font-semibold tracking-wide">Roulette</span>
    </button>
    <button id="nav-btn-list" class="flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-gray-300 transition-colors relative">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
      </svg>
      <span class="text-[11px] font-semibold tracking-wide">Participants</span>
    </button>
  </nav>

  <!-- Winner Modal -->
  <div id="winner-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="bg-gray-900 border border-indigo-500/30 rounded-3xl w-full max-w-sm p-6 text-center shadow-2xl relative">
      
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-300 p-0.5 shadow-xl shadow-amber-500/20 mb-4 flex items-center justify-center">
        <div class="w-full h-full bg-gray-950 rounded-[14px] flex items-center justify-center">
          <svg class="w-8 h-8 text-amber-400 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
          </svg>
        </div>
      </div>

      <p class="text-[11px] uppercase tracking-widest text-indigo-400 font-bold">Gagnant du tirage</p>
      <h3 id="winner-name-txt" class="text-2xl sm:text-3xl font-black text-white mt-1.5 mb-6 tracking-tight break-words px-2">
        -
      </h3>

      <div class="flex flex-col gap-2.5">
        <button id="btn-dismiss-winner" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 active:from-indigo-700 active:to-violet-700 text-white font-bold text-sm shadow-lg shadow-indigo-600/30">
          Relancer
        </button>
        <button id="btn-remove-winner" class="w-full py-2.5 rounded-xl border border-rose-500/30 active:bg-rose-500/10 text-rose-300 text-xs font-semibold flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          Retirer de la liste
        </button>
      </div>
    </div>
  </div>

  <script>
    // State management - Empty initially as requested
    let participants = [];
    let riggedWinner = null;
    let isSpinning = false;
    let currentRotation = 0;
    let soundEnabled = true;
    let hapticEnabled = true;
    let audioCtx = null;
    let lastTickIndex = -1;
    let currentWinner = "";

    // Vibrant colors for sectors
    const palette = [
      '#4f46e5', '#06b6d4', '#10b981', '#f59e0b',
      '#ec4899', '#8b5cf6', '#ef4444', '#14b8a6',
      '#f97316', '#3b82f6'
    ];

    // DOM Elements
    const canvas = document.getElementById('roulette-canvas');
    const ctx = canvas.getContext('2d');
    const viewWheel = document.getElementById('view-wheel');
    const viewParticipants = document.getElementById('view-participants');
    const navBtnWheel = document.getElementById('nav-btn-wheel');
    const navBtnList = document.getElementById('nav-btn-list');
    const quickCount = document.getElementById('quick-count');
    const listCountBadge = document.getElementById('list-count-badge');
    const participantsContainer = document.getElementById('participants-container');
    const inputName = document.getElementById('input-name');
    const btnAddSingle = document.getElementById('btn-add-single');
    const bulkNamesArea = document.getElementById('bulk-names-area');
    const btnImportBulk = document.getElementById('btn-import-bulk');
    const btnClearAll = document.getElementById('btn-clear-all');
    const quickShuffleBtn = document.getElementById('quick-shuffle-btn');
    const mainSpinBtn = document.getElementById('main-spin-btn');
    const spinHubBtn = document.getElementById('spin-hub-btn');
    const spinLoader = document.getElementById('spin-loader');
    const spinBtnText = document.getElementById('spin-btn-text');
    const stealthIndicator = document.getElementById('stealth-indicator');

    // Winner modal
    const winnerModal = document.getElementById('winner-modal');
    const winnerNameTxt = document.getElementById('winner-name-txt');
    const btnDismissWinner = document.getElementById('btn-dismiss-winner');
    const btnRemoveWinner = document.getElementById('btn-remove-winner');

    // Controls
    const soundBtn = document.getElementById('sound-btn');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');
    const hapticBtn = document.getElementById('haptic-btn');
    const iconVibrateOn = document.getElementById('icon-vibrate-on');

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function triggerHaptic(duration = 15) {
      if (hapticEnabled && navigator.vibrate) {
        navigator.vibrate(duration);
      }
    }

    function playTick() {
      triggerHaptic(10);
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(550, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.025);

        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.025);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.025);
      } catch (err) {}
    }

    function playVictoryChime() {
      triggerHaptic([40, 60, 80]);
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;

        const chords = [329.63, 392.00, 523.25, 659.25];
        chords.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.value = freq;

          const start = audioCtx.currentTime + idx * 0.09;
          gain.gain.setValueAtTime(0.2, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(start);
          osc.stop(start + 0.35);
        });
      } catch (err) {}
    }

    function resizeCanvas() {
      const container = canvas.parentElement;
      const size = Math.min(container.clientWidth, container.clientHeight, 440);
      const dpr = window.devicePixelRatio || 1;

      canvas.width = size * dpr;
      canvas.height = size * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);

      drawWheel();
    }

    function drawWheel() {
      const size = canvas.width / (window.devicePixelRatio || 1);
      const center = size / 2;
      const radius = center - 8;

      ctx.clearRect(0, 0, size, size);

      if (participants.length === 0) {
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, 2 * Math.PI);
        ctx.fillStyle = '#111827';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#1f2937';
        ctx.stroke();

        ctx.fillStyle = '#6b7280';
        ctx.font = '600 13px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Aucun participant', center, center - 10);
        ctx.font = '400 11px Inter, sans-serif';
        ctx.fillText('Ajoutez au moins 2 noms', center, center + 12);
        return;
      }

      const total = participants.length;
      const sliceAngle = (2 * Math.PI) / total;

      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(currentRotation);

      for (let i = 0; i < total; i++) {
        const start = i * sliceAngle;
        const color = palette[i % palette.length];

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, start + sliceAngle);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();

        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.stroke();

        ctx.save();
        ctx.rotate(start + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';

        const fontSize = total > 20 ? 11 : total > 12 ? 13 : 15;
        ctx.font = `bold ${fontSize}px Inter, sans-serif`;

        let name = participants[i];
        if (name.length > 15) {
          name = name.slice(0, 13) + '…';
        }

        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 4;
        ctx.fillText(name, radius - 20, 0);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, 2 * Math.PI);
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#1f2937';
      ctx.stroke();

      ctx.restore();
    }

    function spin() {
      if (isSpinning || participants.length < 2) return;
      initAudio();

      isSpinning = true;
      setSpinningUI(true);

      const total = participants.length;
      const sliceAngle = (2 * Math.PI) / total;
      const pointerAngle = (3 * Math.PI) / 2; // Haut (270 deg)

      let targetIndex;
      if (riggedWinner && participants.includes(riggedWinner)) {
        targetIndex = participants.indexOf(riggedWinner);
      } else {
        targetIndex = Math.floor(Math.random() * total);
      }

      // Variation naturelle dans le secteur
      const jitter = (Math.random() - 0.5) * (sliceAngle * 0.5);
      const targetCenterAngle = targetIndex * sliceAngle + sliceAngle / 2;
      const normalizedCurrent = currentRotation % (2 * Math.PI);

      let delta = (pointerAngle - targetCenterAngle + jitter - normalizedCurrent) % (2 * Math.PI);
      if (delta < 0) {
        delta += 2 * Math.PI;
      }

      const fullRotations = (6 + Math.floor(Math.random() * 3)) * (2 * Math.PI);
      const totalDelta = fullRotations + delta;
      const startAngle = currentRotation;
      const duration = 5000;
      const startTime = performance.now();

      function easeOutQuint(t) {
        return 1 - Math.pow(1 - t, 4.2);
      }

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = easeOutQuint(progress);

        currentRotation = startAngle + totalDelta * eased;

        const pointerRef = (pointerAngle - currentRotation) % (2 * Math.PI);
        const positiveRef = (pointerRef + 2 * Math.PI) % (2 * Math.PI);
        const currentSlice = Math.floor(positiveRef / sliceAngle);

        if (currentSlice !== lastTickIndex) {
          playTick();
          lastTickIndex = currentSlice;
        }

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          isSpinning = false;
          setSpinningUI(false);

          const finalPointerAngle = (pointerAngle - currentRotation) % (2 * Math.PI);
          const finalIndex = Math.floor(((finalPointerAngle + 2 * Math.PI) % (2 * Math.PI)) / sliceAngle);
          const winner = participants[finalIndex] || participants[targetIndex];

          showWinner(winner);
        }
      }

      requestAnimationFrame(step);
    }

    function setSpinningUI(active) {
      mainSpinBtn.disabled = active;
      spinHubBtn.disabled = active;
      if (active) {
        spinLoader.classList.remove('hidden');
        spinBtnText.textContent = 'Tirage en cours...';
        mainSpinBtn.classList.add('opacity-75');
      } else {
        spinLoader.classList.add('hidden');
        spinBtnText.textContent = 'Lancer le tirage';
        mainSpinBtn.classList.remove('opacity-75');
      }
    }

    function showWinner(name) {
      currentWinner = name;
      winnerNameTxt.textContent = name;
      winnerModal.classList.remove('hidden');
      winnerModal.classList.add('flex');

      playVictoryChime();

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 70,
          spread: 60,
          origin: { y: 0.6 }
        });
      }
    }

    function renderParticipants() {
      quickCount.textContent = participants.length;
      listCountBadge.textContent = participants.length;
      participantsContainer.innerHTML = '';

      if (participants.length === 0) {
        participantsContainer.innerHTML = `
          <div class="h-44 flex flex-col items-center justify-center text-center p-4 border border-dashed border-gray-800 rounded-2xl">
            <svg class="w-8 h-8 text-gray-600 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
            </svg>
            <p class="text-xs font-semibold text-gray-400">Aucun participant pour le moment</p>
            <p class="text-[11px] text-gray-600 mt-0.5">Écrivez un prénom ci-dessus pour démarrer.</p>
          </div>
        `;
      }

      if (participants.length < 2) {
        mainSpinBtn.disabled = true;
        spinHubBtn.disabled = true;
        mainSpinBtn.classList.add('opacity-50');
      } else if (!isSpinning) {
        mainSpinBtn.disabled = false;
        spinHubBtn.disabled = false;
        mainSpinBtn.classList.remove('opacity-50');
      }

      participants.forEach((name, index) => {
        const item = document.createElement('div');
        const isRigged = (riggedWinner === name);
        item.className = 'participant-item flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-gray-900 border border-gray-800/80 active:bg-gray-800/60 transition-colors cursor-pointer select-none';
        item.dataset.index = index;

        const color = palette[index % palette.length];

        item.innerHTML = `
          <div class="flex items-center gap-3 truncate pointer-events-none">
            <span class="w-3 h-3 rounded-full shrink-0" style="background-color: ${color}"></span>
            <span class="text-sm font-medium text-gray-200 truncate">${escapeHtml(name)}</span>
            ${isRigged ? `<span class="w-1.5 h-1.5 rounded-full bg-indigo-400 shadow-sm shrink-0" title="Choisi"></span>` : ''}
          </div>
          <button data-index="${index}" class="btn-delete p-1 text-gray-500 active:text-rose-400" aria-label="Supprimer">
            <svg class="w-4 h-4 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        `;
        participantsContainer.appendChild(item);
      });

      updateStealthIndicator();
      drawWheel();
    }

    function addName(name) {
      const trimmed = name.trim();
      if (!trimmed) return;
      participants.push(trimmed);
      renderParticipants();
      triggerHaptic(20);
    }

    function removeName(index) {
      if (index >= 0 && index < participants.length) {
        const removed = participants.splice(index, 1)[0];
        if (riggedWinner === removed) {
          riggedWinner = null;
        }
        renderParticipants();
        triggerHaptic(25);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[s]);
    }

    function updateStealthIndicator() {
      if (riggedWinner && participants.includes(riggedWinner)) {
        stealthIndicator.className = "w-1.5 h-1.5 rounded-full bg-indigo-500/50 inline-block";
      } else {
        stealthIndicator.className = "w-1.5 h-1.5 rounded-full bg-transparent inline-block";
      }
    }

    // DISCRETE SELECTION VIA LONG PRESS DIRECTLY ON PARTICIPANT ROW
    let pressTimer = null;
    let longPressed = false;

    participantsContainer.addEventListener('touchstart', (e) => {
      const item = e.target.closest('.participant-item');
      if (!item || e.target.closest('.btn-delete')) return;

      const idx = parseInt(item.dataset.index, 10);
      longPressed = false;

      pressTimer = setTimeout(() => {
        longPressed = true;
        const targetName = participants[idx];
        if (riggedWinner === targetName) {
          riggedWinner = null; // Toggle off if already selected
        } else {
          riggedWinner = targetName; // Silently designate
        }
        triggerHaptic([30, 40]);
        renderParticipants();
      }, 750);
    }, { passive: true });

    participantsContainer.addEventListener('touchend', () => {
      clearTimeout(pressTimer);
    });

    participantsContainer.addEventListener('touchmove', () => {
      clearTimeout(pressTimer);
    });

    // Delete handling
    participantsContainer.addEventListener('click', (e) => {
      if (e.target.closest('.btn-delete')) {
        const idx = parseInt(e.target.closest('.btn-delete').dataset.index, 10);
        removeName(idx);
      }
    });

    // Inputs & buttons
    btnAddSingle.addEventListener('click', () => {
      addName(inputName.value);
      inputName.value = '';
      inputName.focus();
    });

    inputName.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        addName(inputName.value);
        inputName.value = '';
      }
    });

    btnImportBulk.addEventListener('click', () => {
      const lines = bulkNamesArea.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length > 0) {
        participants = lines;
        riggedWinner = null;
        bulkNamesArea.value = '';
        renderParticipants();
        triggerHaptic([20, 30]);
      }
    });

    btnClearAll.addEventListener('click', () => {
      participants = [];
      riggedWinner = null;
      renderParticipants();
      triggerHaptic(20);
    });

    quickShuffleBtn.addEventListener('click', () => {
      for (let i = participants.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [participants[i], participants[j]] = [participants[j], participants[i]];
      }
      renderParticipants();
      triggerHaptic(20);
    });

    mainSpinBtn.addEventListener('click', spin);
    spinHubBtn.addEventListener('click', spin);

    // Navigation tabs
    navBtnWheel.addEventListener('click', () => {
      viewWheel.classList.remove('hidden');
      viewParticipants.classList.add('hidden');
      navBtnWheel.className = 'flex flex-col items-center justify-center gap-1 text-indigo-400 transition-colors';
      navBtnList.className = 'flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-gray-300 transition-colors relative';
      resizeCanvas();
    });

    navBtnList.addEventListener('click', () => {
      viewWheel.classList.add('hidden');
      viewParticipants.classList.remove('hidden');
      navBtnList.className = 'flex flex-col items-center justify-center gap-1 text-indigo-400 transition-colors relative';
      navBtnWheel.className = 'flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-gray-300 transition-colors';
    });

    // Winner modal buttons
    btnDismissWinner.addEventListener('click', () => {
      winnerModal.classList.add('hidden');
      winnerModal.classList.remove('flex');
    });

    btnRemoveWinner.addEventListener('click', () => {
      const idx = participants.indexOf(currentWinner);
      if (idx !== -1) {
        removeName(idx);
      }
      winnerModal.classList.add('hidden');
      winnerModal.classList.remove('flex');
    });

    // Sound / Vibrate controls
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      iconSoundOn.classList.toggle('hidden', !soundEnabled);
      iconSoundOff.classList.toggle('hidden', soundEnabled);
      if (soundEnabled) initAudio();
      triggerHaptic(15);
    });

    hapticBtn.addEventListener('click', () => {
      hapticEnabled = !hapticEnabled;
      iconVibrateOn.classList.toggle('text-indigo-400', hapticEnabled);
      iconVibrateOn.classList.toggle('text-gray-500', !hapticEnabled);
      if (hapticEnabled) triggerHaptic(35);
    });

    // Init
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
      resizeCanvas();
      renderParticipants();
    });
  </script>
</body>
</html>
